<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAI2 to Excel Converter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2430;--muted:#6a7482;--line:#e1e5ea;--accent:#1f6feb;--cr:#14803c;--dr:#b42318;--head:#eef2f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2127;--text:#e8ecf1;--muted:#98a2b0;--line:#2d333b;--accent:#4c8dff;--cr:#4ade80;--dr:#f87171;--head:#262c34;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px}
p.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
textarea{width:100%;height:200px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,label.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{color:var(--muted)}#msg.err{color:var(--dr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.kv{background:var(--head);border-radius:8px;padding:8px 10px}.kv b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--head);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.cr{color:var(--cr)}.dr{color:var(--dr)}
.acct h3{margin:0 0 8px;font-size:15px}
.acct{margin-bottom:14px}
</style>
</head>
<body>
<main>
<h1>BAI2 to Excel Converter</h1>
<p class="sub">Paste a BAI2 statement, review the accounts and transactions, then download everything as an Excel workbook.</p>
<div class="card">
<textarea id="in" spellcheck="false" placeholder="Paste BAI2 file content here…"></textarea>
<div class="row">
<button class="primary" id="parse">Parse</button>
<label class="btn">Open file…<input id="file" type="file" accept=".txt,.bai,.bai2,.csv" hidden></label>
<button id="sample">Load sample</button>
<button id="dl" disabled>Download Excel</button>
<span id="msg"></span>
</div>
</div>
<div id="out"></div>
</main>
<script>
var CODES={"010":"Opening Balance","015":"Closing Balance","045":"Available Closing Balance","100":"Total Credits","400":"Total Debits",
"142":"ACH Credit Received","147":"Individual Bank Card Deposit","164":"Corporate Trade Payment Credit","167":"ACH Settlement Credits","168":"ACH Return Item/Adjustment Settlement","172":"Deposit Correction","173":"Bank-Prepared Deposit","174":"Other Deposit","175":"Check Deposit Package","195":"Incoming Money Transfer","196":"Money Transfer Adjustment","208":"Individual Intl Money Transfer Credit","221":"Foreign Check Purchase","227":"Standing Order","244":"Interest/Matured Principal Payment","246":"Commercial Paper","249":"Misc Security Credit","252":"Debit Reversal","266":"Return Item","275":"ZBA Credit","342":"Broker Deposit","350":"Investment Sold","354":"Interest Credit","359":"Interest Adjustment Credit","395":"Check Reversal","398":"Misc Fee Refund","399":"Miscellaneous Credit","451":"ACH Debit Received","464":"Corporate Trade Payment Debit","466":"ACH Settlement","468":"ACH Return Item/Adjustment Settlement","475":"Check Paid","495":"Outgoing Money Transfer","508":"Individual Intl Money Transfer Debit","514":"Foreign Exchange Debit","527":"Standing Order","535":"Purchase of Equity Securities","544":"Interest/Matured Principal Payment","546":"Commercial Paper","549":"Misc Security Debit","555":"Deposited Item Returned","566":"Return Item","575":"ZBA Debit","650":"Investments Purchased","651":"Individual Investment Purchased","654":"Interest Debit","659":"Interest Adjustment Debit","694":"Deposit Reversal","695":"Deposit Correction Debit","698":"Miscellaneous Fees","699":"Miscellaneous Debit"};
var SAMPLE="01,WPACAU2DK,WIBSCUST,060302,1301,01,080,,2/\n02,WIBSCUST,WPACAU2DK,1,060302,,AUD,2/\n03,032000000007,AUD,010,300000,,,015,-100000,,,045,765000,,,/\n88,100,9760000,1,,400,503333,2,/\n16,175,631500,Z,0003930045232,0013256202/\n88,YOUR REF=0013256202\n16,195,9128500,Z,0003930045233,/\n88,OSKO PAYMENT FROM ACME PTY LTD\n16,698,90000,Z,0000050000,/\n88,YOUR REFERENCE: IA000000000\n16,475,413333,Z,0000050001,000123/\n88,CHEQUE PAID\n49,10053332,9/\n03,032000000015,AUD,010,500000,,,015,512500,,,100,12500,1,,400,0,0,/\n16,354,12500,Z,0003930099001,/\n88,INTEREST PAID\n49,1037500,4/\n98,11090832,2,16/\n99,11090832,1,18/";
var D=null;
function $(i){return document.getElementById(i)}
function fmtDate(s){return s&&/^\d{6}$/.test(s)?"20"+s.slice(0,2)+"-"+s.slice(2,4)+"-"+s.slice(4,6):s||""}
function fmtTime(s){return s&&/^\d{4}$/.test(s)?s.slice(0,2)+":"+s.slice(2):s||""}
function amt(v){if(v==null||v==="")return null;var n=Number(v);return isNaN(n)?null:n/100}
function f2(n){return n==null?"":n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function parse(text){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean),recs=[];
  lines.forEach(function(l){
    if(/^88,/.test(l)&&recs.length){
      var p=recs[recs.length-1],c=l.slice(3);
      if(/\/$/.test(p)){p=p.slice(0,-1)+","+c}else{p=p+" "+c}
      recs[recs.length-1]=p;
    }else recs.push(l);
  });
  var R={file:{},group:{},accounts:[],gt:{},ft:{}},acc=null;
  recs.forEach(function(r){
    var raw=r.replace(/\/$/,""),f=raw.split(","),c=f[0];
    if(c==="01")R.file={sender:f[1],receiver:f[2],date:fmtDate(f[3]),time:fmtTime(f[4]),fileId:f[5],recLen:f[6],version:f[8]};
    else if(c==="02")R.group={receiver:f[1],originator:f[2],status:f[3],asOf:fmtDate(f[4]),currency:f[6],modifier:f[7]};
    else if(c==="03"){
      acc={number:f[1],currency:f[2],opening:null,closing:null,available:null,credits:null,creditCount:null,debits:null,debitCount:null,control:null,records:null,tx:[]};
      for(var i=3;i+1<f.length;i+=4){
        var t=f[i],a=amt(f[i+1]),n=f[i+2]===""||f[i+2]==null?null:Number(f[i+2]);
        if(t==="010")acc.opening=a;else if(t==="015")acc.closing=a;else if(t==="045")acc.available=a;
        else if(t==="100"){acc.credits=a;acc.creditCount=n}else if(t==="400"){acc.debits=a;acc.debitCount=n}
      }
      R.accounts.push(acc);
    }else if(c==="16"&&acc){
      var code=f[1],a2=amt(f[2]),k=Number(code),dir=k>=100&&k<400?"Credit":k>=400&&k<700?"Debit":"";
      acc.tx.push({code:code,desc:CODES[code]||"",dir:dir,amount:a2,signed:a2==null?null:(dir==="Debit"?-a2:a2),funds:f[3]||"",bankRef:f[4]||"",custRef:f[5]||"",text:f.slice(6).join(",").trim()});
    }else if(c==="49"&&acc){acc.control=amt(f[1]);acc.records=f[2]}
    else if(c==="98")R.gt={total:amt(f[1]),accounts:f[2],records:f[3]};
    else if(c==="99")R.ft={total:amt(f[1]),groups:f[2],records:f[3]};
  });
  if(!R.accounts.length)throw new Error("No account (03) records found. Is this a BAI2 file?");
  return R;
}

function render(R){
  var h="",kv=function(k,v){return '<div class="kv"><b>'+k+'</b>'+esc(v)+'</div>'};
  h+='<h2>File and group</h2><div class="card"><div class="grid">'+
    kv("Sender",R.file.sender)+kv("Receiver",R.file.receiver)+kv("Created",(R.file.date||"")+" "+(R.file.time||""))+kv("BAI version",R.file.version)+
    kv("As-of date",R.group.asOf)+kv("Currency",R.group.currency)+kv("Accounts",R.gt.accounts||R.accounts.length)+kv("Group control total",f2(R.gt.total))+'</div></div>';
  h+='<h2>Accounts summary</h2><div class="card scroll"><table><tr><th>Account</th><th>Cur</th><th class="n">Opening</th><th class="n">Closing</th><th class="n">Available</th><th class="n">Credits</th><th class="n">Debits</th><th class="n">Txns</th></tr>';
  R.accounts.forEach(function(a){h+='<tr><td>'+esc(a.number)+'</td><td>'+esc(a.currency)+'</td><td class="n">'+f2(a.opening)+'</td><td class="n">'+f2(a.closing)+'</td><td class="n">'+f2(a.available)+'</td><td class="n cr">'+f2(a.credits)+'</td><td class="n dr">'+f2(a.debits)+'</td><td class="n">'+a.tx.length+'</td></tr>'});
  h+='</table></div><h2>Transactions by account</h2>';
  R.accounts.forEach(function(a){
    h+='<div class="card acct scroll"><h3>'+esc(a.number)+' ('+esc(a.currency)+') · '+a.tx.length+' transactions</h3>';
    if(!a.tx.length)h+='<span style="color:var(--muted)">No transaction records.</span>';
    else{h+='<table><tr><th>#</th><th>Code</th><th>Type</th><th>Dir</th><th class="n">Amount</th><th>Bank ref</th><th>Customer ref</th><th>Narrative</th></tr>';
      a.tx.forEach(function(t,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(t.code)+'</td><td>'+esc(t.desc)+'</td><td class="'+(t.dir==="Credit"?"cr":"dr")+'">'+t.dir+'</td><td class="n '+(t.dir==="Credit"?"cr":"dr")+'">'+f2(t.amount)+'</td><td>'+esc(t.bankRef)+'</td><td>'+esc(t.custRef)+'</td><td>'+esc(t.text)+'</td></tr>'});
      h+='</table>'}
    h+='</div>'});
  $("out").innerHTML=h;
}

function numFmt(ws,cols){
  var r=XLSX.utils.decode_range(ws["!ref"]);
  for(var R=r.s.r+1;R<=r.e.r;R++)cols.forEach(function(c){var x=ws[XLSX.utils.encode_cell({r:R,c:c})];if(x&&x.t==="n")x.z="#,##0.00;[Red]-#,##0.00"});
}
function sheet(rows,widths,numCols){
  var ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(function(w){return{wch:w}});numFmt(ws,numCols||[]);
  ws["!freeze"]={xSplit:0,ySplit:1};return ws;
}
function build(R){
  var wb=XLSX.utils.book_new();
  var s=[["Section","Field","Value"],
   ["File","Sender ID",R.file.sender],["File","Receiver ID",R.file.receiver],["File","Created",(R.file.date||"")+" "+(R.file.time||"")],["File","File ID",R.file.fileId],["File","Record length",R.file.recLen],["File","BAI version",R.file.version],
   ["Group","Originator",R.group.originator],["Group","Ultimate receiver",R.group.receiver],["Group","Status",R.group.status],["Group","As-of date",R.group.asOf],["Group","Currency",R.group.currency],
   ["Group trailer","Control total",R.gt.total==null?"":R.gt.total],["Group trailer","Accounts",R.gt.accounts],["Group trailer","Records",R.gt.records],
   ["File trailer","Control total",R.ft.total==null?"":R.ft.total],["File trailer","Groups",R.ft.groups],["File trailer","Records",R.ft.records]];
  XLSX.utils.book_append_sheet(wb,sheet(s,[16,22,30],[2]),"File Summary");
  var a=[["Account","Currency","Opening balance","Closing balance","Available closing balance","Total credits","Credit count","Total debits","Debit count","Transactions","Account control total","Record count"]];
  R.accounts.forEach(function(x){a.push([x.number,x.currency,x.opening,x.closing,x.available,x.credits,x.creditCount,x.debits,x.debitCount,x.tx.length,x.control,x.records==null?"":Number(x.records)])});
  XLSX.utils.book_append_sheet(wb,sheet(a,[18,9,16,16,22,16,12,16,12,13,20,13],[2,3,4,5,7,10]),"Accounts");
  var all=[["Account","Currency","#","Type code","Type description","Direction","Amount","Signed amount","Funds type","Bank reference","Customer reference","Narrative"]];
  R.accounts.forEach(function(x){x.tx.forEach(function(t,i){all.push([x.number,x.currency,i+1,t.code,t.desc,t.dir,t.amount,t.signed,t.funds,t.bankRef,t.custRef,t.text])})});
  XLSX.utils.book_append_sheet(wb,sheet(all,[18,9,6,10,34,10,16,16,10,18,20,50],[6,7]),"All Transactions");
  var used={};
  R.accounts.forEach(function(x){
    var rows=[["#","Type code","Type description","Direction","Amount","Signed amount","Funds type","Bank reference","Customer reference","Narrative"]];
    x.tx.forEach(function(t,i){rows.push([i+1,t.code,t.desc,t.dir,t.amount,t.signed,t.funds,t.bankRef,t.custRef,t.text])});
    var n=String(x.number).replace(/[\\\/?*\[\]:]/g,"").slice(-28)||"Account",b=n,k=1;
    while(used[n]||["File Summary","Accounts","All Transactions"].indexOf(n)>-1)n=b.slice(0,26)+"_"+(k++);
    used[n]=1;XLSX.utils.book_append_sheet(wb,sheet(rows,[6,10,34,10,16,16,10,18,20,50],[4,5]),n);
  });
  return wb;
}

function msg(t,e){$("msg").textContent=t;$("msg").className=e?"err":""}
$("parse").onclick=function(){
  try{D=parse($("in").value);render(D);$("dl").disabled=false;msg(D.accounts.length+" account(s), "+D.accounts.reduce(function(s,a){return s+a.tx.length},0)+" transaction(s) parsed.")}
  catch(e){D=null;$("out").innerHTML="";$("dl").disabled=true;msg(e.message,true)}
};
$("sample").onclick=function(){$("in").value=SAMPLE;$("parse").click()};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("in").value=r.result;$("parse").click()};r.readAsText(f)};
$("dl").onclick=function(){
  if(!D)return;
  try{XLSX.writeFile(build(D),"BAI2_Statement.xlsx");msg("Workbook downloaded.")}
  catch(e){msg("Download failed: "+((e&&e.message)||e),true)}
};
</script>
</body>
</html>
